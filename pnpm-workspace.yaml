# Build scripts: only what each runtime needs, the rest off so strictDepBuilds passes.
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false

# A release installs a day after it came out, EmDash excepted. No package comes from outside the registry.
# No trustPolicy: no-downgrade, since that trips on provenance changes upstream.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - emdash
  - "@emdash-cms/*"
blockExoticSubdeps: true
